name: ruten-fee

services:
  fee-worker:
    image: ruten-fee-worker:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    init: true
    user: "10001:10001"
    working_dir: /app
    environment:
      TZ: Asia/Taipei
      OTP_SERVER_URL: ${OTP_SERVER_URL:?OTP_SERVER_URL is required}
      OTP_CONSUMER_TOKEN: ${OTP_CONSUMER_TOKEN:?OTP_CONSUMER_TOKEN is required}
      RUTEN_DRY_RUN: ${RUTEN_DRY_RUN:-0}
      RUTEN_BROWSER_SMOKE: ${RUTEN_BROWSER_SMOKE:-0}
    volumes:
      - type: bind
        source: ../config.ini
        target: /app/config.ini
        read_only: true
      - type: bind
        source: ../cookies.json
        target: /app/cookies.json
        read_only: true
      - type: bind
        source: ../runtime/logs
        target: /runtime/logs
      - type: bind
        source: ../runtime/state
        target: /runtime/state
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/app:size=256m,uid=10001,gid=10001,mode=0700,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
